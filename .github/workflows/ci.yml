name: CI frontend

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, sécurité et build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: react-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: react-app/.nvmrc
          package-manager-cache: false
      - name: Contrôle des secrets dans les fichiers versionnés
        run: npm run security:source
      - name: Installation reproductible
        run: npm ci --no-fund
      - name: Tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Audit des dépendances, y compris celles de build
        run: npm audit --audit-level=high
      - name: Build sans identifiants de production
        run: npm run build
      - name: Contrôle du livrable
        run: npm run security:dist
      - name: Conserver le livrable de contrôle, sans déployer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-${{ github.sha }}
          path: react-app/dist/
          include-hidden-files: true # Inclut le .htaccess généré.
          if-no-files-found: error
          retention-days: 7
