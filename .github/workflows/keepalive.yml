name: Supabase Keepalive Cron

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Vérifier la configuration
        id: config
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Keepalive non configuré : variables publiques Supabase absentes.'
          fi
      - name: Lecture publique minimale
        if: steps.config.outputs.enabled == 'true'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error --max-time 30 --retry 2 \
            --proto '=https' \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --url "${SUPABASE_URL%/}/rest/v1/domaines?select=id&limit=1"
